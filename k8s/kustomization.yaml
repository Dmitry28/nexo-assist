# Applied by CD (deploy/deploy.sh pins the image first) — manual fallback: k8s/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - db-ca-configmap.yaml
  - deployment.yaml
  - backup-cronjob.yaml
  - service.yaml

# Pinned by commit sha (immutable) — `latest`/branch tags float, so you'd never know what's
# running or how to roll back. One entry rewrites both the app and the migrate initContainer.
# The committed tag is a placeholder: deploy.sh rewrites it with the sha it deploys.
images:
  - name: nexo-assist
    newName: ghcr.io/dmitry28/nexo-assist
    newTag: sha-62719ec
# NOTE: no HPA/PDB — the app runs one replica (why: the NOTE in deployment.yaml).

# Stamps every resource's metadata (not selectors — those are declared per-manifest).
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
