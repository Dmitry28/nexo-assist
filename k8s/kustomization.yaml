# Apply everything with:  kubectl apply -k k8s/
# Override the image per environment:  kustomize edit set image nexo-assist=registry/nexo-assist:<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# The image actually deployed. Pinned by commit sha (immutable) — `latest`/branch tags
# float, so you'd never know what's running or how to roll back. One entry rewrites both
# the app and the migrate initContainer. CD bumps this on release.
images:
  - name: nexo-assist
    newName: ghcr.io/dmitry28/nexo-assist
    newTag: sha-62719ec
# NOTE: no HPA/PDB — the app is a single-replica long-polling bot with in-memory
# state; autoscaling/disruption budgets return with webhook + DB (Phase 3+).

# Stamps every resource's metadata (not selectors — those are declared per-manifest).
labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
