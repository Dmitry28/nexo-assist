name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded runs are cancelled to save minutes — but never on `main`, which deploys.
  # Cancelling there kills the SSH session mid-deploy, so deploy.sh dies before its rollback
  # can run and the bot stays down. On other refs there is nothing to leave half-done.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Dead code check
        run: npm run check:dead-code

      # Lives with the other static checks, not with the image build: it needs no Docker and
      # would otherwise run once per build-image matrix leg.
      - name: Validate k8s manifests
        run: kubectl kustomize k8s/ > /dev/null

      - name: Unit tests
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run

      - name: E2E tests
        run: npm run test:e2e

  # One leg per architecture, each on a runner of that architecture, both in parallel with
  # build-and-test. The app node is Hetzner CX23 (amd64), so amd64 is what actually deploys;
  # arm64 is kept so the image is not tied to one host architecture (an ARM box or an
  # Apple-silicon laptop runs it too).
  #
  # Why native runners and not one QEMU-emulated job: emulating arm64 on an x86 runner made
  # `npm run build` take 136s against 31s native — a ~2min tax on every run. `ubuntu-24.04-arm`
  # is free for public repos, so each leg builds on real silicon instead.
  #
  # Each leg pushes an untagged, digest-only image; publish-image then joins them under the
  # real tags. Nothing is pushed on pull requests — there the build only proves the Dockerfile
  # still works.
  #
  # `name:` is set explicitly so the status-check context stays `build-image (amd64)` rather
  # than GitHub's default of every matrix value joined together. Both contexts are required by
  # branch protection on dev and main — renaming this job means updating those too.
  build-image:
    name: build-image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # push the image to GHCR
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: img
        # GHCR rejects uppercase, and the owner is `Dmitry28` — so lowercase it.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          # `cacheonly` on a PR: build everything, publish nothing.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.img.outputs.name) }}
          # Per-arch scope — one shared scope would have the two legs evict each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # The filename is the digest; the file itself is empty. publish-image only needs the names.
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the two per-arch images into one multi-arch tag. Depends on build-and-test as well as
  # the builds: the slow part (the two image builds) has already run in parallel with the tests
  # by this point, so waiting here costs almost nothing and keeps a red commit's image — and
  # especially the `latest` tag — out of the registry.
  publish-image:
    needs: [build-and-test, build-image]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # `latest` follows production, i.e. `main` — not the default branch, which is `dev`
          # (where we integrate and test locally before promoting), so no {{is_default_branch}}.
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        # One `imagetools create` call: every tag from metadata-action pointing at both digests.
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      # Proves the tag really carries both architectures, not just the last one pushed.
      - name: Inspect
        run: docker buildx imagetools inspect "${{ steps.img.outputs.name }}:${{ steps.meta.outputs.version }}"

  # Deploy the commit that was just built. Only on a push to `main` — production is promoted
  # from `dev` by merging it here (never from a PR — a fork must not be able to reach the
  # cluster) — and only after tests AND the image are green.
  deploy:
    needs: [build-and-test, publish-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer commit supersedes an older one still waiting.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # No kubeconfig or cluster port is exposed: we SSH in, and the key on the server is
      # restricted to running deploy.sh (see deploy/setup-server.sh), so it can do nothing else.
      - name: Deploy over SSH
        env:
          CD_SSH_KEY: ${{ secrets.CD_SSH_KEY }}
          CD_HOST: ${{ secrets.CD_HOST }}
          CD_HOST_KEY: ${{ secrets.CD_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CD_SSH_KEY" > ~/.ssh/cd_key
          chmod 600 ~/.ssh/cd_key
          # Pin the host key rather than ssh-keyscan it — why, in docs/DEPLOY.md §5b.
          # TODO [L]: validate CD_SSH_KEY too (empty/mangled reads as "Permission denied", i.e.
          # looks like a server problem), and require a base64 field in CD_HOST_KEY —
          # "ssh-ed25519" alone passes today and yields an obscure ssh error instead of this one.
          if [ -z "$CD_HOST" ]; then
            echo "::error::CD_HOST is not set — see docs/DEPLOY.md §5b."
            exit 1
          fi
          case "$CD_HOST_KEY" in
            ssh-* | ecdsa-*) ;;
            *)
              echo "::error::CD_HOST_KEY is missing or malformed — refusing to deploy without verifying the host. Its value is printed by deploy/setup-server.sh on the box; see docs/DEPLOY.md §5b."
              exit 1
              ;;
          esac
          printf '%s %s\n' "$CD_HOST" "$CD_HOST_KEY" > ~/.ssh/known_hosts
          # The sha is the only argument the server accepts; it validates it before use.
          ssh -i ~/.ssh/cd_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy@"$CD_HOST" "${{ github.sha }}"
