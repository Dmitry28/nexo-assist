    <radialGradient id="glass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#BFE6FF" stop-opacity=".22"/><stop offset="1" stop-color="#1E3A8A" stop-opacity=".25"/></radialGradient>
