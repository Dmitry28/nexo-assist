# Local stack (not a deploy artifact — see docs/DEPLOY.md for the deploy story).
#   npm run db:up            # just Postgres (dev: run the app with npm run start:dev)
#   npm run dev:docker       # full stack with hot-reload (override applies migrations)
# NOTE: the base file alone runs the prod-like runtime image and does not auto-apply
# migrations — apply the schema first (npm run migration:run from the host).

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      # APP_ENV drives app behavior (JSON logs, token required, Swagger off). Without it
      # appEnv falls back to development and the runtime image crashes on the pruned
      # pino-pretty transport. The dev override sets it back to development.
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://app:app@postgres:5432/app
    env_file:
      # NOTE: with APP_ENV=production both TELEGRAM_BOT_TOKEN and SCRAPE_PROXY_URL are
      # required — provide them here (.env) or via the environment; without either the
      # container exits at boot. Any non-empty URL satisfies validation here — nothing fetches
      # kufar at startup. `npm run dev:docker` overrides APP_ENV and needs neither.
      - path: .env
        required: false
    # Healthcheck is inherited from the image (see Dockerfile HEALTHCHECK).
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Bound to loopback: the default publishes on every interface, so a laptop on a shared
      # network offers a Postgres with the credentials printed two lines below. Only the host
      # connects here (the app container reaches it by service name).
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
